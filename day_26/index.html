<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Локальный чат</title>
<style>
  :root { --bg: #fafafa; --fg: #1d1d1f; --muted: #6e6e73; --user: #dbeafe; --bot: #fff; --border: #e5e5ea; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161618; --fg: #ececf1; --muted: #9a9aa0; --user: #1e3a5f; --bot: #232327; --border: #333338; --accent: #60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
         font: 15px/1.5 -apple-system, system-ui, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  header small { color: var(--muted); }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; max-width: 860px; width: 100%; margin: 0 auto; }
  .msg { padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; max-width: 90%; border: 1px solid var(--border); }
  .user { align-self: flex-end; background: var(--user); }
  .assistant { align-self: flex-start; background: var(--bot); font-family: inherit; }
  .empty { color: var(--muted); text-align: center; margin-top: 30vh; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); max-width: 860px; width: 100%; margin: 0 auto; }
  textarea { flex: 1; resize: none; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--bot); color: var(--fg); font: inherit; }
  button { padding: 0 16px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #reset { background: transparent; color: var(--accent); border: 1px solid var(--border); padding: 6px 12px; }
</style>
</head>
<body>
<header>
  <div><b>Локальный чат</b> <small id="model"></small></div>
  <button id="reset" type="button">Новый чат</button>
</header>
<main id="log"></main>
<form id="form">
  <textarea id="input" rows="2" placeholder="Сообщение… (Enter — отправить, Shift+Enter — новая строка)" autofocus></textarea>
  <button id="send">Отправить</button>
</form>
<script>
const log = document.getElementById('log'), input = document.getElementById('input'),
      send = document.getElementById('send'), form = document.getElementById('form');

function loadSid() {
  try {
    let sid = sessionStorage.getItem('sid');
    if (!sid) { sid = crypto.randomUUID(); sessionStorage.setItem('sid', sid); }
    return sid;
  } catch { return crypto.randomUUID(); }
}
let sid = loadSid();

function add(role, text) {
  log.querySelector('.empty')?.remove();
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  log.append(el);
  log.scrollTop = log.scrollHeight;
  return el;
}
function showEmpty() { log.innerHTML = '<div class="empty">Напишите сообщение, чтобы начать</div>'; }

async function loadHistory() {
  const r = await fetch('/api/history?sid=' + sid).then(r => r.json());
  document.getElementById('model').textContent = r.model;
  showEmpty();
  r.messages.forEach(m => add(m.role, m.content));
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  input.value = '';
  send.disabled = true;
  add('user', text);
  const out = add('assistant', '…');
  try {
    const resp = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({ sid, message: text }) });
    if (!resp.ok) { out.textContent = 'Ошибка: ' + (await resp.json()).error; return; }
    const reader = resp.body.getReader(), dec = new TextDecoder();
    out.textContent = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      out.textContent += dec.decode(value, { stream: true });
      log.scrollTop = log.scrollHeight;
    }
  } catch (err) {
    out.textContent = 'Ошибка сети: ' + err.message;
  } finally {
    send.disabled = false;
    input.focus();
  }
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

document.getElementById('reset').addEventListener('click', async () => {
  await fetch('/api/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sid }) });
  showEmpty();
  input.focus();
});

loadHistory();
</script>
</body>
</html>
