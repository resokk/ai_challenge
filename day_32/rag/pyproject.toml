[project]
name = "camunda-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Roman Sokk", email = "resokk@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.143.0",
    "lxml>=6.1.3",
    "mcp>=1.9",
    "numpy>=2.4.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=3",
    "sqlglot>=30.22.0",
    "torch>=2.14.1",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
camunda-rag = "camunda_rag:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
